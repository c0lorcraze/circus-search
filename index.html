<!DOCTYPE html>
<html>
  <head>
    <title>The Circus</title>
    <style>
      body{
        background-image: url('images/background_home.jpg');
        background-repeat: no-repeat;
        background-size: cover;
        background-attachment: fixed;
        margin: 0;
      }
      .tent {
        display: block;
        margin-left: auto;
        margin-right: auto;
        margin-top: 250px;
        height: 900px;
          
      }
      #message {
    position: absolute;
    top: 100px;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 35px;
    color: red;
    font-family: Georgia, serif;
    text-shadow: 2px 2px 5px black;
    z-index: 10;
}
    </style>
  </head>
  <body>
      <img onclick="a()" title="Enter?" src="images/Circus_Tent.png" alt= "tent" class= "tent">
      <img src="images/EyeGif_Full" alt="Eye" style= float: right>
      <p id="message"></p>
        <script>
      var count = 0;
      function a() {
        count++;
        if (count == 1){
          text = "No.";
          document.getElementById("message").textContent = text;
        }
        if (count == 2){
          text = "I don't wanna.";
          document.getElementById("message").textContent = text;
        }
        if (count == 3){
          text = "No, I don't think so.";
          document.getElementById("message").textContent = text;
        }
        if (count == 4){
          text = "Can we do something else?";
          document.getElementById("message").textContent = text;
        }
          
        if (count == 5){
          text = "OOH! What's that?";
          window.location = "page1.html";
          document.getElementById("message").textContent = text;
          return;
        }
      }
    </script>
  </body>
</html>
